<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital World Clock - All Countries</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 1400px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .search-section {
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 12px 20px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .clock-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .clock-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .clock-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }

        .timezone-label {
            font-size: 0.85em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .timezone-name {
            font-size: 1.25em;
            color: #333;
            font-weight: bold;
            margin-bottom: 12px;
            word-break: break-word;
        }

        .country-name {
            font-size: 0.9em;
            color: #555;
            margin-bottom: 10px;
        }

        .digital-display {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            margin: 15px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .time-format {
            font-size: 0.95em;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .date-display {
            font-size: 0.9em;
            color: #777;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }

        .timezone-offset {
            font-size: 0.85em;
            color: #888;
            margin-top: 8px;
        }

        .controls {
            text-align: center;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #eee;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .controls label {
            font-size: 1em;
            color: #333;
            font-weight: 500;
            display: flex;
            align-items: center;
        }

        .controls select {
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 1em;
            color: #333;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 200px;
        }

        .controls select:hover {
            border-color: #764ba2;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 0, 0, 0.7);
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2em;
            transition: all 0.3s ease;
            display: none;
        }

        .clock-card:hover .remove-btn {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .remove-btn:hover {
            background: rgba(255, 0, 0, 1);
            transform: scale(1.1);
        }

        .quick-select {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }

        .quick-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quick-btn:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        .stats {
            text-align: center;
            color: #666;
            font-size: 0.95em;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .clocks-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 15px;
            }

            .digital-display {
                font-size: 1.8em;
            }

            .controls select {
                min-width: 150px;
            }
        }
    </style>
</head>

        let activeTimezones = [];

        // Initialize with default timezones
        function initializeClocks() {
            const defaultTimezones = [
                'America/New_York',
                'Europe/London',
                'Asia/Shanghai'
            ];

            activeTimezones = defaultTimezones;
            updateClocks();
            
            // Update clocks every second
            setInterval(updateClocks, 1000);
            
            // Update timezone count
            document.getElementById('tzCount').textContent = timezones.length;
        }

        function updateClocks() {
            const grid = document.getElementById('clocksGrid');
            
            activeTimezones.forEach((tz, index) => {
                let card = document.getElementById(`clock-${index}`);
                
                if (!card) {
                    card = document.createElement('div');
                    card.id = `clock-${index}`;
                    card.className = 'clock-card';
                    grid.appendChild(card);
                }

                const tzData = timezones.find(t => t.tz === tz);
                const time = new Date().toLocaleString('en-US', { timeZone: tz });
                const date = new Date(time);
                
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                const seconds = String(date.getSeconds()).padStart(2, '0');
                
                const dateStr = date.toLocaleDateString('en-US', { 
                    weekday: 'short', 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric' 
                });

                const offset = getTimezoneOffset(tz);

                card.innerHTML = `
                    <button class="remove-btn" onclick="removeTimezone('${tz}')">×</button>
                    <div class="timezone-label">Timezone</div>
                    <div class="timezone-name">${tzData ? tzData.flag + ' ' + tzData.name : tz}</div>
                    ${tzData ? `<div class="country-name">${tzData.country}</div>` : ''}
                    <div class="digital-display">${hours}:${minutes}:${seconds}</div>
                    <div class="time-format">24-Hour Format</div>
                    <div class="timezone-offset">UTC ${offset}</div>
                    <div class="date-display">${dateStr}</div>
                `;
            });

            // Remove extra cards
            while (grid.children.length > activeTimezones.length) {
                grid.removeChild(grid.lastChild);
            }

            // Update clock count
            document.getElementById('clockCount').textContent = activeTimezones.length;
        }

        function getTimezoneOffset(tz) {
            const time = new Date().toLocaleString('en-US', { timeZone: tz });
            const date = new Date(time);
            const utcDate = new Date(date.toLocaleString('en-US', { timeZone: 'UTC' }));
            const offset = (date - utcDate) / (1000 * 60 * 60);
            const sign = offset >= 0 ? '+' : '';
            return `${sign}${offset}`;
        }

        function addTimezone() {
            const select = document.getElementById('timezoneSelect');
            const tz = select.value;

            if (!tz) {
                alert('Please select a timezone');
                return;
            }

            if (activeTimezones.includes(tz)) {
                alert('This timezone is already displayed');
                return;
            }

            activeTimezones.push(tz);
            select.value = '';
            updateClocks();
        }

        function addQuickTimezone(tz) {
            if (activeTimezones.includes(tz)) {
                alert('This timezone is already displayed');
                return;
            }
            activeTimezones.push(tz);
            updateClocks();
        }

        function removeTimezone(tz) {
            activeTimezones = activeTimezones.filter(t => t !== tz);
            updateClocks();
        }

        function clearAllClocks() {
            activeTimezones = [];
            updateClocks();
        }

        function searchTimezones(query) {
            const lowerQuery = query.toLowerCase();
            filteredTimezones = timezones.filter(tz => 
                tz.name.toLowerCase().includes(lowerQuery) ||
                tz.country.toLowerCase().includes(lowerQuery) ||
                tz.tz.toLowerCase().includes(lowerQuery)
            );
            updateTimezoneSelect();
        }

        function populateTimezoneSelect() {
            const select = document.getElementById('timezoneSelect');
            // Add all timezones grouped by region
            const regions = {};
            timezones.forEach(tz => {
                const region = tz.tz.split('/')[0];
                if (!regions[region]) {
                    regions[region] = [];
                }
                regions[region].push(tz);
            });

            Object.keys(regions).sort().forEach(region => {
                const optgroup = document.createElement('optgroup');
                optgroup.label = region;
                regions[region].forEach(tz => {
                    const option = document.createElement('option');
                    option.value = tz.tz;
                    option.textContent = `${tz.flag} ${tz.name}, ${tz.country}`;
                    optgroup.appendChild(option);
                });
                select.appendChild(optgroup);
            });
        }

        function updateTimezoneSelect() {
            const select = document.getElementById('timezoneSelect');
            select.innerHTML = '<option value="">Select a timezone...</option>';
            
            const regions = {};
            filteredTimezones.forEach(tz => {
                const region = tz.tz.split('/')[0];
                if (!regions[region]) {
                    regions[region] = [];
                }
                regions[region].push(tz);
            });

            Object.keys(regions).sort().forEach(region => {
                const optgroup = document.createElement('optgroup');
                optgroup.label = region;
                regions[region].forEach(tz => {
                    const option = document.createElement('option');
                    option.value = tz.tz;
                    option.textContent = `${tz.flag} ${tz.name}, ${tz.country}`;
                    optgroup.appendChild(option);
                });
                select.appendChild(optgroup);
            });
        }

        // Initialize when page loads
        window.addEventListener('load', () => {
            populateTimezoneSelect();
            initializeClocks();
        });

        // Search functionality
        document.addEventListener('DOMContentLoaded', () => {
            const searchBox = document.getElementById('searchBox');
            const timezoneSelect = document.getElementById('timezoneSelect');
            
            searchBox.addEventListener('input', (e) => {
                searchTimezones(e.target.value);
            });

            timezoneSelect.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    addTimezone();
                }
            });
        });
